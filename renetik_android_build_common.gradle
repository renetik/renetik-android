buildscript {
    ext {
        sdk_version = 37
        min_sdk_version = 26
        kotlin_version = '2.4.10'
        coroutines_version = '1.11.0'
        appcompat_version = '1.7.1'
        material_version = '1.9.0'
        ktx_version = '1.19.0'
        junit_version = '4.13.2'
        mockk_version = '1.14.9'
        robolectric_version = '4.16.1'
        play_version = '18.0.1'
        is_renetik_development = false
        is_renetik_library_network = true
        is_renetik_library_maps = true
    }
}
allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }

    }
}
wrapper {
    gradleVersion = "9.5.0"
    distributionType = Wrapper.DistributionType.BIN
}
